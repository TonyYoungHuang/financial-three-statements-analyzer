<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #F8FAFC;
        }
        .bento-card {
            background: #ffffff;
            border: 1px solid #E2E8F0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .input-focus-ring:focus {
            outline: none;
            border-color: #0058be;
            box-shadow: 0 0 0 1px #0058be;
        }

<body class="font-body-md text-on-surface">
<div class="min-h-screen flex flex-col justify-center items-center px-sm py-xl">
<div class="max-w-[480px] w-full space-y-md">
<div class="text-center space-y-xs mb-lg">
<div class="flex justify-center mb-sm">
<div class="bg-primary p-xs rounded-xl inline-flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[32px]" data-icon="account_balance">account_balance</span>
</div>
</div>
<h1 class="font-display-lg text-display-lg text-primary">财务三表分析器</h1>
<p class="font-body-md text-on-surface-variant">面向投资者的专业财务报表 AI 分析工具</p>
</div>
<main class="bento-card rounded-xl p-lg space-y-md">
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="activation-code">
                        激活码 / ACTIVATION CODE
                    </label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-md py-sm font-data-tabular text-data-tabular input-focus-ring transition-all placeholder:text-outline" id="activation-code" placeholder="输入您的 16 位激活序列号" type="text"/>
<div class="absolute right-sm top-1/2 -translate-y-1/2 flex items-center gap-xs">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="vpn_key">vpn_key</span>
</div>
</div>
</div>
<div class="space-y-sm">
<button class="w-full bg-primary hover:bg-primary-fixed-variant text-on-primary font-title-sm text-title-sm py-sm rounded-lg transition-colors flex items-center justify-center gap-xs cursor-pointer active:scale-[0.98]">
                        验证并进入
                        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<div class="pt-sm border-t border-outline-variant space-y-sm">
<div class="flex items-start gap-sm p-sm bg-error-container/30 rounded-lg">
<span class="material-symbols-outlined text-error text-[20px] mt-0.5" data-icon="error">error</span>
<div class="space-y-xs">
<p class="font-body-sm text-body-sm text-on-error-container font-semibold">验证遇到问题？</p>
<ul class="font-body-sm text-body-sm text-on-error-container/80 list-disc list-inside space-y-1">
<li>无效激活码：请核对字符是否输入正确</li>
<li>已过期：该激活码的服务期限已截止</li>
<li>会话过多：该激活码已在其他设备登录</li>
</ul>
</div>
</div>
</div>
</main>
<footer class="text-center space-y-xs">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    激活码有效期与购买的服务计划相关。未获得激活码？
                    <a class="text-secondary font-semibold hover:underline transition-all" href="#">咨询商务支持</a>
</p>
<div class="flex justify-center items-center gap-md pt-sm">
<a class="font-label-caps text-label-caps text-outline hover:text-on-surface-variant transition-colors" href="#">隐私权政策</a>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<a class="font-label-caps text-label-caps text-outline hover:text-on-surface-variant transition-colors" href="#">服务条款</a>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<a class="font-label-caps text-label-caps text-outline hover:text-on-surface-variant transition-colors" href="#">联系我们</a>
</div>
</footer>
</div>
<div class="fixed bottom-0 left-0 w-full p-lg pointer-events-none opacity-20">
<div class="grid grid-cols-4 gap-lg">
<div class="h-32 bg-outline-variant/10 rounded-xl border border-dashed border-outline-variant"></div>
<div class="h-32 bg-outline-variant/10 rounded-xl border border-dashed border-outline-variant"></div>
<div class="h-32 bg-outline-variant/10 rounded-xl border border-dashed border-outline-variant"></div>
<div class="h-32 bg-outline-variant/10 rounded-xl border border-dashed border-outline-variant"></div>
</div>
</div>
</div>
<div class="fixed top-lg right-lg max-w-[320px] w-full z-50 pointer-events-none">
<div class="bg-surface-container-highest border-l-4 border-error p-sm rounded-lg shadow-lg flex items-center gap-sm opacity-0 transform translate-x-10 transition-all duration-300">
<span class="material-symbols-outlined text-error" data-icon="cancel">cancel</span>
<div>
<p class="font-body-md text-on-surface font-bold">激活失败</p>
<p class="font-body-sm text-on-surface-variant">该激活码不存在或已失效。</p>
</div>
</div>
</div>
