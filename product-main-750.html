<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>财务三表分析器电商主图</title>
    <link rel="stylesheet" href="./product-main-750.css" />
  </head>
  <body>
    <main class="main-card" aria-label="财务三表分析器 PWA 电商主图">
      <section class="copy">
        <div class="badge-row">
          <span>电子交付</span>
          <span>激活码开通</span>
          <span>PWA 在线工具</span>
        </div>
        <p class="kicker">贷款调查报告模板 · 升级工具版</p>
        <h1>财务三表分析器 PWA</h1>
        <p class="subtitle">上传三表 PDF，自动生成财务质量与风险分析报告</p>
        <div class="scenario">
          <strong>适合银行信贷 / 财务尽调 / 外部公司评估</strong>
          <span>看懂盈利质量、现金流质量、偿债风险和关键指标</span>
        </div>
      </section>

      <section class="visual">
        <div class="report-panel">
          <div class="panel-head">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="score-row">
            <div class="score-ring">
              <strong>82</strong>
              <small>Grade A</small>
            </div>
            <div>
              <p>综合结论</p>
              <h2>值得进一步研究</h2>
              <em>重点核查利润现金含量</em>
            </div>
          </div>
          <div class="metric-grid">
            <div><span>毛利率</span><strong>43.3%</strong></div>
            <div><span>现金流/净利润</span><strong>0.63x</strong></div>
            <div><span>资产负债率</span><strong>41.3%</strong></div>
          </div>
          <div class="risk-line">
            <span>风险提示</span>
            <strong>经营现金流 · 应收账款 · 偿债能力</strong>
          </div>
        </div>

        <div class="upload-stack">
          <div>资产负债表 PDF</div>
          <div>损益表 PDF</div>
          <div>现金流量表 PDF</div>
        </div>
      </section>

      <footer class="bottom-strip">
        <div><strong>三表上传</strong><span>PDF 识别</span></div>
        <div><strong>指标计算</strong><span>风险评分</span></div>
        <div><strong>报告导出</strong><span>PDF 下载</span></div>
      </footer>
    </main>
  </body>
</html>
